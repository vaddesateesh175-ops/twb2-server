<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <ul id="d1">


    </ul>
    <script>
        fetch("http://localhost:5500/todos")
        .then(res=>res.json())
        .then(data=>{
            data.forEach(todo=>{
                var nli=document.createElement("li")
                nli.innerText=todo.title

                var btn=document.createElement("button")
                btn.innerText="DELETE"
                btn.onclick=function(){
                    DeleteTodo(todo._id)
                }
                nli.appendChild(btn)
                document.getElementById("d1").appendChild(nli)
            })
        })
        function DeleteTodo(id){
            fetch(`http://localhost:5500/${id}`,{
                method:"DELETE"
            }).then(res=>res.json())
        }
    </script>
</body>
</html>
