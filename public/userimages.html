<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <ul id="d1">

    </ul>

    <script>
        function genui(){

             fetch("http://localhost:5500/images")
             .then(res=>res.json())
             .then((data)=>{
                data.forEach(image=> {
                    var nli=document.createElement("li")
                    var nim=document.createElement("img")
                    nim.src=image.imgUrl
              
                    var btn=document.createElement("button")
                    btn.innerText=`like : ${image.Likes}`
                    btn.onclick=function(){
                      addlike(image._id)
                    }
                    nli.appendChild(nim)
                    nli.appendChild(btn)
                    document.getElementById("d1").appendChild(nli)
                });
            })
        }
        genui()
        function addlike(id){
            fetch(`http://localhost:5500/like/${id}`,{
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({id:id})
            }).then(res=>res.json())
            .then((data)=>{
                document.getElementById("d1").innerHTML=""
                genui()
            })
        }
        
    </script>
</body>
</html>
