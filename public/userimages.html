<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <ul id="d1">

    </ul>

    <script>
        fetch("http://localhost:5500/images")
        .then(res=>res.json())
        .then((data)=>{
            data.forEach(image=> {
                var nli=document.createElement("img")
                nli.src=image.imgUrl
                document.getElementById("d1").appendChild(nli)
            });
            
        })
        
    </script>
</body>
</html>
