     <form onsubmit="add(event)" id="form">
        <label>Enter the type of problem</label>
        <br>
        <input type="text" name="issueType">
        <br>
        <label>enter your remark</label>
        <br>
        <textarea name="remark" ></textarea>
        <br>
        <button type="submit" >submit the issue</button>
    </form>
    <script>
        function add(ev){
            ev.preventDefault();
            var issueType=form.issueType.value;
            //console.log(issueType)
            var remark=form.remark.value;
          //  console.log(remark)
          //  console.log(JSON.stringify({issueType,remark}))
            fetch("http://localhost:3600/issue",{
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({issueType,remark})
            })
            
        }
    </script>
