<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <ul id="d1">

    </ul>

    <script>
        fetch("http://localhost:5500/leads/leads")
        .then(res=>res.json())
        .then(data=>{
            data.forEach(lead => {
                var nli=document.createElement("li")
            nli.innerText=lead.fullname

            var btn=document.createElement("button")
            btn.innerText="Delete"
            btn.onclick=function(){
                Delete(lead._id)
            }

            nli.appendChild(btn)
            document.getElementById("d1").appendChild(nli)
            });
            
        })
        function Delete(id){
            fetch(`http://localhost:5500/leads/${id}`,{
                method:"Delete"
            }).then(res=>res.json())
        }
    </script>
</body>
</html>
